application:
  subdomain: transmute
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://transmute:3313/

services:
  transmute:
    # upstream: ghcr.io/transmute-app/transmute:v2.1.1
    image: ghcr.1ms.run/transmute-app/transmute:v2.1.1
    binds:
      - /lzcapp/var/transmute:/app/data
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - --tries=1
        - http://localhost:3313/api/health/ready
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
